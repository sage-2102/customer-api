spring.application.name=customer-api

# Secrets live in a separate file that is NOT committed to Git
spring.config.import=optional:file:./secrets.properties

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5433/customerdb
spring.datasource.username=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true